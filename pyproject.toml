[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reigner"
version = "0.2.0"
description = "Single-agent, retrieval-shaped, citation-faithful agents over compiled knowledge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Construct Lab" }]
keywords = ["agents", "retrieval", "rag", "llm", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "tiktoken>=0.7",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
server = []
mcp = []
ingestion = ["pymupdf>=1.24", "httpx>=0.27"]
otel = []
all = ["anthropic>=0.39", "openai>=1.40", "google-genai>=0.3", "pymupdf>=1.24", "httpx>=0.27"]

[project.scripts]
reigner = "reigner.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/Construct-Lab/reigner"
Issues = "https://github.com/Construct-Lab/reigner/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reigner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["reigner"]

[[tool.mypy.overrides]]
module = ["pymupdf"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
